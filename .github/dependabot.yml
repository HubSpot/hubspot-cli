version: 2
# Routine updates never include major versions: majors are breaking and cannot
# be merged without additional work, so they are handled manually. The
# `version-update:semver-major` ignore below applies only to version updates;
# Dependabot security updates are exempt from update-types ignores, so a major
# bump can still be proposed when it is required to fix a vulnerability.
updates:
  # Root CLI package. A committed yarn.lock lets Dependabot see the full
  # transitive graph, so security and version updates cover nested deps
  # (e.g. deps pulled in through the @hubspot/* libraries), not just direct ones.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait before proposing newly published versions; a fresh release can be
    # malicious or unstable (supply-chain hardening).
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Internal libraries are bumped together (minor/patch only, per the
      # major-version ignore above).
      hubspot-dependencies:
        patterns:
          - "@hubspot/*"
      # Fold routine minor/patch bumps of everything else into one PR to cut noise.
      external-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@hubspot/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/acceptance-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      acceptance-tests:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
